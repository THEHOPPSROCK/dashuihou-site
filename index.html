<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7F2">
<title>大水喉展厅 · 隐私与支持</title>
<style>
  :root{ --ink:#3A2E25; --ink2:#8A7B6C; --cream:#FFF7F2; --gold:#FFCD00; --navy:#004384; --line:#E6DACF; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px;
    background:var(--cream); color:var(--ink);
    font:16px/1.8 "PingFang SC","Hiragino Sans GB",-apple-system,system-ui,sans-serif;
  }
  .card{max-width:460px; width:100%}
  .brand{display:flex; align-items:center; gap:14px; margin-bottom:28px}
  .brand img{width:64px; height:auto}
  .brand b{font-size:22px}
  h1{font-size:22px; margin:0 0 6px}
  .sub{color:var(--ink2); font-size:14px; margin:0 0 30px}
  a.item{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:18px 20px; margin-bottom:14px; border:1.5px solid var(--ink);
    border-radius:16px; background:#fff; color:inherit; text-decoration:none;
    box-shadow:3px 4px 0 #e6d9c9;
  }
  a.item:active{transform:translate(1px,2px); box-shadow:2px 2px 0 #e6d9c9}
  a.item b{font-size:17px; display:block}
  a.item small{color:var(--ink2); font-size:13px}
  a.item span{font-size:24px; color:var(--navy)}
  footer{margin-top:26px; color:var(--ink2); font-size:13px; text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="logo-r.png" alt="大水喉 Dashuihou">
    <b>大水喉展厅</b>
  </div>
  <h1>隐私与支持</h1>
  <p class="sub">大水喉 Dashuihou · iOS 版</p>

  <a class="item" href="./privacy.html">
    <span><b>隐私政策</b><small>我们如何处理你的数据</small></span>
    <span>›</span>
  </a>
  <a class="item" href="./support.html">
    <span><b>支持与反馈</b><small>常见问题、联系方式</small></span>
    <span>›</span>
  </a>

  <footer>© 2026 大水喉 Dashuihou</footer>
</div>
</body>
</html>
